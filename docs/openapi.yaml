                  type: integer
                  minimum: 0
                  maximum: 1440
                  description: Zero or omitted uses the machine's configured availability window
      responses:
        '200':
          description: One-time request recorded; the worker reports acknowledgement on heartbeat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '409':
          description: Clear the machine drain before offering capacity
  /settings:
    get:
      operationId: getClusterSettings
      summary: Read main-admin cluster setup and public certificate information
      responses:
        '200':
          description: Active settings; private keys and worker credentials are never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSettings'
        '403':
          description: Administrator required
  /settings/network:
    put:
      operationId: configureClusterNetwork
      summary: Configure an additional managed HTTPS listener without changing primary access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, hostname, port]
              properties:
                enabled:
                  type: boolean
                hostname:
                  type: string
                  description: Local DNS hostname or private IP included in the certificate SAN
                port:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                rotateCa:
                  type: boolean
                  default: false
                  description: Explicitly replace cluster trust; all remote workers must then trust the new CA
      responses:
        '200':
          description: Listener applied and saved; primary access remains available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSettings'
        '400':
          description: Invalid hostname or port
        '409':
          description: Port unavailable; previous configuration retained
  /settings/github:
    put:
      operationId: configureGitHubApp
      summary: Save the central GitHub App connection and optional private-key upload
      description: Changing the App, installation or repository requires existing runner registrations to drain. Key replacement for the same App preserves registrations. The key is stored in a private server-owned file and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                appId:
                  type: integer
                  minimum: 1
                installationId:
                  type: integer
                  minimum: 1
                repository:
                  type: string
                workstationGroupId: {type: integer, minimum: 0, description: Dedicated selected-repository organization runner group; zero disables sharing}
                workstationRepositories: {type: array, maxItems: 10, items: {type: string}, description: Exact private repository allowlist including the primary repository}
                organizationRunners:
                  type: boolean
                  description: Explicitly opt into organization runner administration; omission preserves the existing choice
                privateKeyPem:
                  type: string
                  writeOnly: true
                  maxLength: 16384
                  description: PEM RSA private key; omit to preserve the existing key
      responses:
        '200':
          description: Connection saved and active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSettings'
        '409':
          description: Existing runners must drain before scope or App changes
  /settings/github/test:
    post:
      operationId: testGitHubApp
      summary: Verify runner administration and Actions read access using separate scoped tokens
      responses:
        '200':
          description: Repository access verified without registering or deleting a runner
        '400':
          description: Connection unavailable or required access missing
  /open-webui:
    get:
      operationId: openWebUIStatus
      summary: Read the configured Open WebUI companion endpoint and live health status
      responses:
        '200':
          description: Current Open WebUI configuration and live /health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenWebUIStatus'
  /settings/open-webui:
    put:
      operationId: configureOpenWebUI
      summary: Save the Open WebUI companion URL and optional Ollama backend URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, url]
              properties:
                enabled:
                  type: boolean
                url:
                  type: string
                ollamaBaseUrl:
                  type: string
      responses:
        '200':
          description: Open WebUI settings saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSettings'
        '400':
          description: Invalid Open WebUI or Ollama origin URL
  /settings/open-webui/test:
    post:
      operationId: testOpenWebUI
      summary: Probe an Open WebUI endpoint's /health route
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url:
                  type: string
      responses:
        '200':
          description: Open WebUI health check succeeded
        '400':
          description: Open WebUI endpoint unavailable or invalid
  /settings/log-limit:
    put:
      operationId: configureRetainedOutput
      summary: Set the retained output limit without a server restart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bytes]
              properties:
                bytes:
                  type: integer
                  minimum: 1
                  maximum: 67108864
      responses:
        '200':
          description: Policy saved and active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSettings'
  /settings/worker-bundle:
    get:
      operationId: downloadWorkerSetup
      summary: Download guided worker bootstrap, helper and public CA
      description: Includes the server binary only for a matching OS/architecture. No enrollment token, GitHub App key, CA private key or worker credential is included. Only administrators can download a bundle.
      parameters:
      - in: query
        name: name
        required: true
        schema:
          type: string
          maxLength: 128
      - in: query
        name: url
        required: true
        schema:
          type: string
          format: uri
      - in: query
        name: os
        required: true
        schema:
          type: string
          enum: [darwin, linux]
      - in: query
        name: arch
        required: true
        schema:
          type: string
          enum: [arm64, amd64]
      - in: query
        name: kind
        schema:
          type: string
          enum: [ci, worker]
          default: ci
      responses:
        '200':
          description: ZIP with SHA256SUMS and setup instructions
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /worker/status:
    get:
      operationId: getOwnWorkerStatus
      summary: Read only the authenticated worker's machine status
      security:
      - workerBearer: []
      responses:
        '200':
          description: This worker's current machine record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
  /worker/drain:
    post:
      operationId: drainOwnWorker
      summary: Withdraw only this worker's new Sluicework claims while assigned work finishes
      security:
      - workerBearer: []
      responses:
        '200':
          description: This worker is draining; no other machine is modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
  /worker/runner:
    post:
      operationId: workstationRunner
      tags: [Workers]
      summary: Acquire or control this machine's approved ephemeral GitHub runner
      description: Requires server-side GitHub App configuration and an administrator-approved workstation runner. Scope, labels and runner IDs are derived from that registration. JIT credentials are returned only once and must never be logged. Pause withdraws custom labels without canceling assigned work.
      security:
      - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation]
              properties:
                operation:
                  type: string
                  enum: [acquire, status, enable, pause, release]
      responses:
        '200':
          description: Current runner lease; a new grant includes one-run credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  runner:
                    type: object
                    properties:
                      id:
                        type: integer
                      busy:
                        type: boolean
                      status:
                        type: string
                  encoded_jit_config:
                    type: string
                    description: Secret one-run credentials; never log or expose in the console.
        '401':
          description: Invalid or revoked worker credential
        '400':
          description: Invalid operation or no approved workstation registration
        '409':
          description: Draining machine or busy runner cannot be enabled/released
        '503':
          description: GitHub App not configured
  /worker/claim:
    post:
      operationId: claimAttempt
      summary: Atomically claim eligible queued work
      tags:
      - Workers
      security:
      - workerBearer: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '204':
          description: No eligible work or free capacity.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /worker/attempts/{id}/renew:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: renewLease
      summary: Renew a lease or receive a pending cancellation request
      description: An attempt with a pending cancellation retains its existing lease deadline to allow the worker to confirm it stopped.
      tags:
      - Workers
      security:
      - workerBearer: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Renewal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /worker/attempts/{id}/logs:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: appendLog
      summary: Append bounded logs to the active attempt
      tags:
      - Workers
      security:
      - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogUpload'
      responses:
        '204':
          description: Completed with no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /worker/attempts/{id}/complete:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: completeAttempt
      summary: Report the terminal status and bounded output
      tags:
      - Workers
      security:
      - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Completion'
      responses:
        '204':
          description: Completed with no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /worker/attempts/{id}/infer:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: infer
      summary: Request inference for an authorized AI attempt
      tags:
      - Workers
      security:
      - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceInputs'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/Upstream'
components:
  securitySchemes:
    codingBearer:
      type: http
      scheme: bearer
      description: Revocable model-scoped coding credential; distinct from console and worker identities

    browserSession:
      type: apiKey
      in: cookie
      name: sluicework_session
    workerBearer:
      type: http
      scheme: bearer
      description: Per-worker credential issued at enrollment. Attempt operations also require an active lease owned
        by the calling worker.
  parameters:
    Id:
      name: id
      in: path
      description: Opaque resource identifier. Under /worker/attempts this is the attempt ID returned by claim.
      required: true
      schema:
        type: string
    After:
      name: after
      in: query
      description: Exclusive log ID cursor. Defaults to zero.
      required: false
      schema:
        type: integer
        minimum: 0
        format: int64
    LastEventId:
      name: Last-Event-ID
      in: header
      description: Exclusive log ID used for reconnects. Takes precedence over after.
      required: false
      schema:
        type: integer
        minimum: 0
        format: int64
  responses:
    BadRequest:
      description: Invalid request, input, JSON body or cursor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Credentials are missing, expired, invalid or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, transport or browser origin check failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No resource has this ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The operation conflicts with current state, an active lease, or the provider policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMedia:
      description: Send Content-Type application/json on mutations, including bodyless console operations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: The structured JSON result exceeds the retention limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Upstream:
      description: The broker could not complete the provider call.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal service or database failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    GitHubRoutingPolicy:
      type: object
      additionalProperties: false
      required: [version, placement, platform, machineLabel, queueMinutes]
      allOf:
        - if:
            properties: {version: {enum: [2, 3]}}
          then:
            required: [fallbackRunner]
          else:
            not: {required: [fallbackRunner]}
        - if:
            properties: {version: {const: 2}}
          then:
            properties: {placement: {enum: [prefer-local, local-only]}}
        - if:
            properties: {version: {const: 3}}
          then:
            required: [priority, fallbackQueueMinutes]
            oneOf:
              - properties: {priority: {const: high}, queueMinutes: {enum: [5, 15]}}
              - properties: {priority: {const: low}, queueMinutes: {const: 60}}
          else:
            properties: {queueMinutes: {maximum: 15}}
            not:
              anyOf:
                - required: [priority]
                - required: [fallbackQueueMinutes]
      properties:
        version: {type: integer, enum: [1, 2, 3]}
        fallbackRunner:
          type: object
          description: Version 2 requires a distinct second runner; absent in version 1. Queue timeout applies to each runner.
          additionalProperties: false
          required: [platform, machineLabel]
          properties:
            platform: {type: string, enum: [macos-arm64, macos-x64, linux-arm64, linux-x64]}
            machineLabel: {type: string, minLength: 1, maxLength: 100}
        placement: {type: string, enum: [prefer-local, local-only, cloud-only]}
        platform: {type: string, enum: [macos-arm64, macos-x64, linux-arm64, linux-x64, linux], description: Version 3 permits linux with machineLabel self-hosted for any self-hosted Linux architecture in the Default runner group.}
        machineLabel:
          type: string
          maxLength: 100
          description: Use self-hosted with version 3 platform linux for the generic Linux pool in the Default runner group. Other local selectors require a unique custom label.
        queueMinutes: {type: integer, minimum: 1, maximum: 60}
        priority: {type: string, enum: [high, low], description: Version 3 only; high uses 15 minutes (legacy 5 remains readable), low uses 60 minutes}
        fallbackQueueMinutes: {type: integer, minimum: 1, maximum: 5, description: Version 3 second-runner window; default 2}
    GitHubIntegration:
      type: object
      additionalProperties: false
      required: [version, variable, workflow, platforms, defaults]
      properties:
        version: {type: integer, enum: [1, 2, 3]}
        variable: {type: string, const: SLUICEWORK_ROUTING}
        workflow: {type: string, description: Reviewed .github/workflows/ path}
        platforms: {type: array, items: {type: string}, minItems: 1, maxItems: 5}
        dispatcher:
          type: object
          additionalProperties: false
          required: [appId, backendId, heartbeatSha]
          properties:
            appId: {type: integer, minimum: 1}
            backendId: {type: string, minLength: 1, maxLength: 100}
            heartbeatSha: {type: string, pattern: '^[a-f0-9]{40}$'}
        defaults: {$ref: '#/components/schemas/GitHubRoutingPolicy'}
    GitHubRoutingState:
      type: object
      additionalProperties: false
      required: [repository, integration, policy, source, revision]
      properties:
        repository: {type: string}
        integration: {$ref: '#/components/schemas/GitHubIntegration'}
        policy: {$ref: '#/components/schemas/GitHubRoutingPolicy'}
        source: {type: string, enum: [workflow defaults, legacy repository variables, repository variable]}
        revision: {type: string, description: Hash of integration and effective published/legacy configuration}
    GitHubRunnerGroup:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        inherited: {type: boolean}
        restricted_to_workflows: {type: boolean}
    GitHubActionRunner:
      type: object
      additionalProperties: false
      required: [id, name, os, labels, busy, status, scope, managed, available]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        os: {type: string}
        status: {type: string, enum: [online, offline]}
        busy: {type: boolean}
        scope: {type: string, enum: [repository, organization]}
        managed: {type: boolean, description: Sluicework-owned registration; use Machines for changes}
        machineId: {type: string}
        available: {type: boolean, description: Repository access confirmed by GitHub runner-group visibility}
        group: {$ref: '#/components/schemas/GitHubRunnerGroup'}
        labels:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: {type: string}
              type: {type: string, enum: [custom, read-only]}
    GitHubRoutingTarget:
      type: object
      required: [name, platform, machineLabel, managed, online, busy]
      properties:
        name: {type: string}
        platform: {type: string}
        machineLabel: {type: string}
        managed: {type: boolean}
        online: {type: boolean}
        busy: {type: boolean}
    GitHubRunnerInventory:
      type: object
      additionalProperties: false
      required: [configured, repository, organizationEnabled, runners, targets]
      properties:
        configured: {type: boolean}
        repository: {type: string}
        organizationEnabled: {type: boolean}
        organizationIssue: {type: string}
        runners: {type: array, items: {$ref: '#/components/schemas/GitHubActionRunner'}}
        targets: {type: array, items: {$ref: '#/components/schemas/GitHubRoutingTarget'}}
    GitHubRegistrationSetup:
      type: object
      additionalProperties: false
      required: [scope, url, name, label, application, token, expires_at]
      properties:
        scope: {type: string, enum: [repository, organization]}
        url: {type: string, format: uri}
        name: {type: string}
        label: {type: string}
        token: {type: string, format: password, description: Short-lived GitHub registration token; never persisted}
        expires_at: {type: string, format: date-time}
        application:
          type: object
          required: [os, architecture, filename, download_url, sha256_checksum]
          properties:
            os: {type: string, enum: [linux, osx]}
            architecture: {type: string, enum: [arm64, x64]}
            filename: {type: string}
            download_url: {type: string, format: uri}
            sha256_checksum: {type: string, pattern: '^[a-f0-9]{64}$'}
    Error:
      type: object
      properties:
        error:
          type: string
      additionalProperties: false
      required:
      - error
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
      additionalProperties: false
      required:
      - username
      - password
    User:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          enum:
          - admin
          - operator
      additionalProperties: false
      required:
      - username
      - role
    EnrollmentToken:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          description: Lifetime in seconds.
      additionalProperties: false
      required:
      - token
      - expiresIn
    Enrollment:
      type: object
      properties:
        id:
          type: string
        credential:
          type: string
      additionalProperties: false
      required:
      - id
      - credential
      description: The worker saves this response to a private file bound to the orchestrator origin.
    WorkerInfo:
      type: object
      properties:
        os:
          type: string
          enum: ['', darwin, linux]
          description: Reported by the worker from its runtime. Missing on legacy workers.
        arch:
          type: string
          enum: ['', arm64, amd64]
          description: amd64 means x86-64. Missing on legacy workers.
        name:
          type: string
          maxLength: 128
        version:
          type: string
          maxLength: 128
        roles:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 64
          uniqueItems: true
        workstation:
          $ref: '#/components/schemas/WorkstationStatus'
        runnerStatus:
          type: string
        runnerReason:
          type: string
          maxLength: 256
          description: Current workstation admission or drain reason.
      additionalProperties: false
      required:
      - name
      - roles
      description: The worker advertises its platform, capabilities and last observed launchd or systemd runner service status.
    EnrollRequest:
      type: object
      properties:
        token:
          type: string
        info:
          $ref: '#/components/schemas/WorkerInfo'
      additionalProperties: false
      required:
      - token
      - info
    GitHubActivity:
      type: object
      required: [configured, builds]
      additionalProperties: false
      properties:
        configured:
          type: boolean
        repositories:
          type: array
          items: {type: string}
          description: Explicitly configured shared repositories; omitted for repository-only runners
        repository:
          type: string
        syncedAt:
          type: string
          format: date-time
          description: Last complete successful sync; omitted until the first success.
        issue:
          type: string
          description: Safe explanation of missing permission or temporary sync failure.
        builds:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/GitHubBuild'
    GitHubBuild:
      type: object
      required: [repository, machineId, runnerId, runId, jobId, attempt, workflow, name, branch, sha, status, url]
      additionalProperties: false
      properties:
        repository:
          type: string
        machineId:
          type: string
        runnerId:
          type: integer
          format: int64
        runId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        attempt:
          type: integer
        workflow:
          type: string
        name:
          type: string
        branch:
          type: string
        sha:
          type: string
        status:
          type: string
          description: Last GitHub-reported job status, such as in_progress or completed.
        conclusion:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        step:
          type: string
          description: Name of the in-progress step, when supplied by GitHub.
        url:
          type: string
          format: uri
          description: Canonical GitHub job URL constructed for the configured repository.
    OpenWebUIStatus:
      type: object
      additionalProperties: false
      required: [configured, enabled, healthy]
      properties:
        configured:
          type: boolean
        enabled:
          type: boolean
        url:
          type: string
        ollamaBaseUrl:
          type: string
        healthy:
          type: boolean
        error:
          type: string
    ClusterSettings:
      type: object
      additionalProperties: false
      required: [hostname, os, arch, dataDir, primaryListen, network, logLimit]
      properties:
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        dataDir:
          type: string
          readOnly: true
        primaryListen:
          type: string
          readOnly: true
        logLimit:
          type: integer
        githubIssue:
          type: string
        openWebUI:
          type: object
          additionalProperties: false
          required: [enabled, url]
          properties:
            enabled:
              type: boolean
            url:
              type: string
            ollamaBaseUrl:
              type: string
        github:
          type: object
          additionalProperties: false
          required: [appId, installationId, repository, keyConfigured]
          properties:
            appId:
              type: integer
            installationId:
              type: integer
            repository:
              type: string
            workstationGroupId: {type: integer}
            workstationRepositories: {type: array, items: {type: string}}
            organizationRunners:
              type: boolean
            keyConfigured:
              type: boolean
        network:
          type: object
          additionalProperties: false
          required: [enabled, hostname, port]
          properties:
            enabled:
              type: boolean
            hostname:
              type: string
            port:
              type: integer
            url:
              type: string
              format: uri
            caPem:
              type: string
              description: Public CA certificate only
            fingerprint:
              type: string
              description: SHA-256 of the public CA DER, uppercase hexadecimal
            certificateExpires:
              type: string
              format: date-time
            issue:
              type: string
    WorkstationSettings:
      type: object
      additionalProperties: false
      required: [buildThreads, maxLoadPerCpu, minAvailableMemoryMb, minIdleSeconds, requireAcPower, enableMinutes]
      properties:
        buildThreads:
          type: integer
          minimum: 1
          maximum: 8
        maxLoadPerCpu:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        minAvailableMemoryMb:
          type: integer
          minimum: 512
          maximum: 1048576
        minIdleSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Linux requires zero because input-idle detection is unavailable.
        requireAcPower:
          type: boolean
        enableMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Used on the next local enable; saving does not extend an existing opt-in window.
    WorkstationStatus:
      type: object
      additionalProperties: false
      required: [settingsVersion, local, effective]
      properties:
        controlVersion:
          type: integer
          enum: [0, 1]
        appliedControl:
          type: string
          maxLength: 128
          description: Last observed capacity-request ID; old requests do not enable a restarted session
        settingsVersion:
          type: integer
          enum: [1]
        local:
          $ref: '#/components/schemas/WorkstationSettings'
          description: Installation defaults reported by this controller.
        effective:
          $ref: '#/components/schemas/WorkstationSettings'
          description: Settings used by the current runner, or the next runner if no listener is active.
        enabledUntil:
          type: string
          format: date-time
    Runner:
      type: object
      properties:
        control:
          type: object
          readOnly: true
          additionalProperties: false
          required: [id, operation, issuedAt, enabledUntil]
          properties:
            id:
              type: string
            operation:
              type: string
              enum: [enable, pause]
            issuedAt:
              type: string
              format: date-time
            enabledUntil:
              type: string
              format: date-time
        settings:
          anyOf:
          - $ref: '#/components/schemas/WorkstationSettings'
          - type: 'null'
          description: Admin-managed settings, applied between builds. Set null explicitly to restore installation defaults; omission preserves existing settings for older clients. Requires a compatible workstation controller.
        workstation:
          type: boolean
          description: Administrator approval for the opt-in ephemeral workstation controller. Requires a repository scope and a configured server-side GitHub App; service is unused.
        name:
          type: string
        scope:
          type: string
          description: GitHub owner or owner/repository.
        labels:
          type: array
          items:
            type: string
        service:
          type: string
          description: Official actions.runner.*.service systemd unit on Linux, or launchd label optionally prefixed by its system, user, or GUI domain on macOS.
      additionalProperties: false
      required:
      - name
    MachinePatch:
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
          uniqueItems: true
          maxItems: 64
        slots:
          type: integer
          minimum: 1
          maximum: 256
          default: 1
        roleLimits:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 256
        draining:
          type: boolean
        runner:
          $ref: '#/components/schemas/Runner'
          description: Set name to an empty string to remove the registration.
      additionalProperties: false
    Machine:
      type: object
      properties:
        os:
          type: string
          enum: ['', darwin, linux]
          description: Actual worker operating system, absent until a legacy worker upgrades.
        arch:
          type: string
          enum: ['', arm64, amd64]
          description: Actual worker CPU architecture (amd64 means x86-64).
        name:
          type: string
          maxLength: 128
        version:
          type: string
          maxLength: 128
        roles:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 64
          uniqueItems: true
        workstation:
          $ref: '#/components/schemas/WorkstationStatus'
        runnerStatus:
          type: string
        runnerReason:
          type: string
          maxLength: 256
          description: Current workstation admission or drain reason.
        labels:
          type: array
          items:
            type: string
          uniqueItems: true
          maxItems: 64
        slots:
          type: integer
          minimum: 1
          maximum: 256
          default: 1
        roleLimits:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 256
        draining:
          type: boolean
        runner:
          $ref: '#/components/schemas/Runner'
          description: Set name to an empty string to remove the registration.
        id:
          type: string
        lastHeartbeat:
          type: string
          format: date-time
        online:
          type: boolean
        revoked:
          type: boolean
        running:
          type: integer
      additionalProperties: false
      required:
      - id
      - name
      - version
      - roles
      - labels
      - slots
      - roleLimits
      - draining
      - lastHeartbeat
      - online
      - revoked
      - running
    Input:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
        required:
          type: boolean
        paths:
          type: array
          items:
            type: string
          description: Approved absolute input files on the selected worker. Omit for a literal text input.
      additionalProperties: false
      required:
      - name
    Job:
      type: object
      properties:
        os:
          type: string
          enum: ['', darwin, linux]
          description: Required worker OS. Empty or omitted permits either. Never falls back across an explicit platform restriction.
        arch:
          type: string
          enum: ['', arm64, amd64]
          description: Required worker architecture (amd64 is x86-64). Empty or omitted permits either. Preserved in the approved run revision and retries.
        id:
          type: string
          readOnly: true
        revision:
          type: integer
          description: On PUT, supply the current revision to detect conflicting edits.
        name:
          type: string
          maxLength: 160
        type:
          type: string
          enum:
          - script
          - ai
        role:
          type: string
          description: Defaults to script for a script and agent for an AI task.
        labels:
          type: array
          items:
            type: string
          description: All labels must match the worker.
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Input'
        command:
          type: string
          description: Absolute path to an approved executable. Required for scripts.
        args:
          type: array
          items:
            type: string
          description: Passed as argument elements. {{name}} substitutes a declared literal or staged file.
        workDir:
          type: string
          description: Subdirectory of the fresh attempt directory.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
        prompt:
          type: string
          description: Approved template with {{name}} placeholders. Required for AI tasks.
        connection:
          type: string
          description: Connection ID selected by the template. Required for AI tasks.
        model:
          type: string
        maxTokens:
          type: integer
          minimum: 0
          maximum: 131072
        allowCloud:
          type: boolean
          default: false
        outputFormat:
          type: string
          enum:
          - text
          - json
        outputLimit:
          type: integer
          minimum: 1
          maximum: 4194304
          default: 65536
          description: Retained output limit in bytes.
        discardOutput:
          type: boolean
        safeToRepeat:
          type: boolean
        maxAutoRetries:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
          description: Optional automatic retries. Nonzero values require safeToRepeat.
      additionalProperties: false
      required:
      - name
      - type
      description: Saving a job approves a new immutable revision. AI tasks require a permitted model, prompt and connection.
    InputValues:
      type: object
      properties:
        inputs:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
    Attempt:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
        automatic:
          type: boolean
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - timed_out
          - cancelled
          - interrupted
        machineId:
          type: string
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        leaseUntil:
          type: string
          format: date-time
        cancelRequested:
          type: boolean
        outcomeUnknown:
          type: boolean
        output:
          type: string
        outputTruncated:
          type: boolean
        logsTruncated:
          type: boolean
        error:
          type: string
      additionalProperties: false
      required:
      - id
      - number
      - automatic
      - state
      - queuedAt
      - cancelRequested
      - outcomeUnknown
      - outputTruncated
      - logsTruncated
    Run:
      type: object
      properties:
        id:
          type: string
        jobId:
          type: string
        job:
          $ref: '#/components/schemas/Job'
        inputs:
          type: object
          additionalProperties:
            type: string
        trigger:
          type: string
        scheduleId:
          type: string
        createdAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - timed_out
          - cancelled
          - interrupted
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
      additionalProperties: false
      required:
      - id
      - jobId
      - job
      - inputs
      - trigger
      - createdAt
      - state
      - attempts
      description: Each run contains its approved job revision, immutable input values and attempts in ascending order.
    Claim:
      type: object
      properties:
        runId:
          type: string
        attemptId:
          type: string
        job:
          $ref: '#/components/schemas/Job'
        inputs:
          type: object
          additionalProperties:
            type: string
        leaseUntil:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - runId
      - attemptId
      - job
      - inputs
      - leaseUntil
    Renewal:
      type: object
      properties:
        leaseUntil:
          type: string
          format: date-time
        cancelRequested:
          type: boolean
      additionalProperties: false
      required:
      - leaseUntil
      - cancelRequested
    LogUpload:
      type: object
      properties:
        text:
          type: string
        sequence:
          type: integer
          minimum: 0
          format: int64
          description: Supply consecutive per-attempt sequence numbers starting at 1 for idempotent retries. Omit or
            use 0 for unsequenced append.
      additionalProperties: false
      required:
      - text
    Log:
      type: object
      properties:
        id:
          type: integer
          format: int64
        attemptId:
          type: string
        at:
          type: string
          format: date-time
        text:
          type: string
        truncated:
          type: boolean
      additionalProperties: false
      required:
      - id
      - attemptId
      - at
      - text
    Completion:
      type: object
      properties:
        state:
          type: string
          enum:
          - succeeded
          - failed
          - timed_out
          - cancelled
          - interrupted
        output:
          type: string
        outputTruncated:
          type: boolean
        error:
          type: string
      additionalProperties: false
      required:
      - state
    ScheduleSpec:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        jobId:
          type: string
        cron:
          type: string
          description: 'Five cron fields: minute, hour, day of month, month, day of week. Sunday is 0 or SUN.'
        timezone:
          type: string
          description: IANA time zone, e.g. America/Winnipeg.
        inputs:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
          default: true
        allowOverlap:
          type: boolean
          default: false
      additionalProperties: false
      required:
      - name
      - jobId
      - cron
      - timezone
    Occurrence:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
        localSlot:
          type: string
          description: Local wall time through minutes, without an offset.
        status:
          type: string
          enum:
          - queued
          - missed
          - skipped_overlap
        runId:
          type: string
        details:
          type: string
      additionalProperties: false
      required:
      - scheduledAt
      - localSlot
      - status
    Schedule:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        jobId:
          type: string
        cron:
          type: string
          description: 'Five cron fields: minute, hour, day of month, month, day of week. Sunday is 0 or SUN.'
        timezone:
          type: string
          description: IANA time zone, e.g. America/Winnipeg.
        inputs:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
          default: true
        allowOverlap:
          type: boolean
          default: false
        id:
          type: string
        nextRun:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        latest:
          oneOf:
          - $ref: '#/components/schemas/Occurrence'
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - name
      - jobId
      - cron
      - timezone
      - inputs
      - enabled
      - allowOverlap
      - nextRun
      - latest
    PersonalTicket:
      type: object
      additionalProperties: false
      required: [id, code, expires]
      properties:
        id: {type: string}
        code: {type: string, format: password, description: One-use enrollment code; keep out of URLs, arguments and logs.}
        expires: {type: string, format: date-time}
    PersonalEnrollment:
      type: object
      additionalProperties: false
      required: [ticketId, code, name, publicKey, signature]
      properties:
        ticketId: {type: string}
        code: {type: string, format: password}
        name: {type: string, maxLength: 128}
        publicKey: {type: string, description: Base64url Ed25519 public key. The private key stays in the runtime.}
        signature: {type: string, description: Signature of the enrollment context, ticket ID and public-key fingerprint.}
    PersonalWebSearch:
      type: object
      additionalProperties: false
      description: Explicit local permission for hosted public web research. Empty object allows public websites. No signed-in browser sessions or local tools.
      properties:
        allowedDomains:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Lowercase public DNS domains without schemes or paths; includes subdomains. Omit or leave empty for unrestricted public search.
          items: {type: string, maxLength: 253}
    PersonalCitation:
      type: object
      additionalProperties: false
      required: [url, title, start, end]
      properties:
        url: {type: string, format: uri, maxLength: 4096, description: Public HTTP(S) citation URL; displayed but never fetched by the agent.}
        title: {type: string}
        start: {type: integer, minimum: 0, description: Inclusive Unicode code-point offset in saved result text.}
        end: {type: integer, minimum: 1, description: Exclusive Unicode code-point offset in saved result text.}
    PersonalManifest:
      type: object
      additionalProperties: false
      required: [name, prompt, model, cron, timezone, expires, maxRunsPerDay, timeoutSeconds, outputLimit, shareResults]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        prompt: {type: string, minLength: 1, maxLength: 65536}
        model: {type: string, minLength: 1, maxLength: 191}
        cron: {type: string, description: Five-field cron expression; no embedded timezone.}
        timezone: {type: string, description: Explicit IANA timezone.}
        expires: {type: string, format: date-time, description: Local approval expires within 366 days.}
        maxRunsPerDay: {type: integer, minimum: 1, maximum: 24}
        timeoutSeconds: {type: integer, minimum: 15, maximum: 1800}
        outputLimit: {type: integer, minimum: 128, maximum: 65536}
        shareResults: {type: boolean, default: false, description: Upload generated output and citation URLs only if the exact local approval permits it. Otherwise send status only.}
        webSearch: {$ref: '#/components/schemas/PersonalWebSearch'}
        desktopNotifications: {type: boolean, default: false, description: Explicit local consent for status-only success/failure alerts on the runtime desktop. No task name or report content is included.}
    PersonalProposalInput:
      type: object
      additionalProperties: false
      required: [runtimeId, manifest]
      properties:
        runtimeId: {type: string}
        manifest: {$ref: '#/components/schemas/PersonalManifest'}
    PersonalProposal:
      type: object
      additionalProperties: false
      required: [id, revision, runtimeId, owner, manifest]
      properties:
        id: {type: string}
        revision: {type: integer}
        runtimeId: {type: string}
        owner: {type: string, readOnly: true}
        manifest: {$ref: '#/components/schemas/PersonalManifest'}
    PersonalRuntime:
      type: object
      additionalProperties: false
      required: [id, owner, name, lastSeen, report]
      properties:
        id: {type: string, description: SHA256 fingerprint of the runtime public key.}
        owner: {type: string}
        name: {type: string}
        lastSeen: {type: string, format: date-time}
        report: {$ref: '#/components/schemas/PersonalReport'}
    PersonalRun:
      type: object
      additionalProperties: false
      required: [id, scheduleId, slot, started, state]
      properties:
        id: {type: string}
        scheduleId: {type: string}
        slot: {type: string, description: Local wall-clock slot without UTC offset, deduplicated across fall-back DST.}
        started: {type: string, format: date-time}
        state: {type: string}
        message: {type: string}
        result: {type: string, description: Omitted unless locally authorized for sharing.}
        citations: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/PersonalCitation'}, description: Omitted with private result text unless local approval permits sharing.}
        webSearched: {type: boolean, default: false}
        notification: {type: string, enum: [not_requested, pending, attempting, submitted, failed, unknown], description: Submitted means accepted by the desktop command; OS settings determine actual display. Unknown after restart is never replayed automatically.}
    PersonalReport:
      type: object
      additionalProperties: false
      required: [paused, signedIn, models, approvals, runs]
      properties:
        paused: {type: boolean}
        signedIn: {type: boolean}
        models: {type: array, maxItems: 128, items: {type: string}}
        approvals:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, digest, paused, revision, cron, timezone, model, expires]
            properties:
              id: {type: string}
              digest: {type: string}
              paused: {type: boolean}
              revision: {type: integer}
              cron: {type: string}
              timezone: {type: string}
              model: {type: string}
              expires: {type: string, format: date-time}
              webSearch: {$ref: '#/components/schemas/PersonalWebSearch'}
              desktopNotifications: {type: boolean, default: false}
        runs: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/PersonalRun'}}
    PersonalEnvelope:
      type: object
      additionalProperties: false
      required: [runtimeId, timestamp, nonce, payload, signature]
      properties:
        runtimeId: {type: string}
        timestamp: {type: integer, format: int64, description: Unix seconds within two minutes of server time.}
        nonce: {type: string, description: Fresh 24-byte random base64url nonce; accepted once.}
        payload: {$ref: '#/components/schemas/PersonalReport'}
        signature: {type: string, description: Ed25519 signature over protocol context, runtime ID, timestamp, nonce and SHA256 of the compact payload.}
    ConnectionConfig:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - ollama
          - chatgpt
          - openai
          - anthropic
          - gemini
        endpoint:
          type: string
          description: Required for Ollama or Herd. Use verified HTTPS for a private LAN endpoint. Loopback also permits
            HTTP. Cloud connections use the official vendor base URL.
        models:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 128
          uniqueItems: true
        contextLength:
          type: integer
          minimum: 0
          maximum: 32768
          description: Ollama only. Use 0 for the runtime default or 512–32768 tokens. Setup starts at 4096.
        keepAliveSeconds:
          type: integer
          minimum: 0
          maximum: 300
          default: 0
          description: Ollama only. Release model memory after each request at 0; keep warm for up to five minutes otherwise.
        thinking:
          type: boolean
          default: false
          description: Ollama only. Curated models use direct answers unless enabled. Thinking consumes output tokens and its text is not retained as a job result.
        disabled:
          type: boolean
        api_key:
          type: string
          writeOnly: true
          format: password
          description: Required when creating an API-key connection. Forbidden for chatgpt; create plan connections through /chatgpt/sign-in. Supply a replacement key on PUT to rotate. An empty
            or omitted key preserves the existing credential.
      additionalProperties: false
      required:
      - name
      - kind
      - models
    Connection:
      type: object
      properties:
        owner:
          type: string
          readOnly: true
          description: Present for personal subscription connections; empty or omitted for shared connections.
        name:
          type: string
        kind:
          type: string
          enum:
          - ollama
          - chatgpt
          - openai
          - anthropic
          - gemini
        endpoint:
          type: string
          description: Required for Ollama or Herd. Use verified HTTPS for a private LAN endpoint. Loopback also permits
            HTTP. Cloud connections use the official vendor base URL.
        models:
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 128
          uniqueItems: true
        contextLength:
          type: integer
          minimum: 0
          maximum: 32768
          description: Ollama only. Use 0 for the runtime default or 512–32768 tokens. Setup starts at 4096.
        keepAliveSeconds:
          type: integer
          minimum: 0
          maximum: 300
          default: 0
          description: Ollama only. Release model memory after each request at 0; keep warm for up to five minutes otherwise.
        thinking:
          type: boolean
          default: false
          description: Ollama only. Curated models use direct answers unless enabled. Thinking consumes output tokens and its text is not retained as a job result.
        disabled:
          type: boolean
        id:
          type: string
        health:
          type: string
          enum:
          - untested
          - healthy
          - error
        last_checked:
          type: string
          format: date-time
        last_error:
          type: string
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - endpoint
      - models
      - disabled
      - health
    ModelPreset:
      type: object
      required: [model, name, download, description, minMemoryGB, optional, installable, source]
      properties:
        model: {type: string}
        name: {type: string}
        download: {type: string, description: "Approximate registry download size, not inference memory."}
        description: {type: string}
        minMemoryGB: {type: integer, description: Advisory hardware budget.}
        optional: {type: boolean}
        installable: {type: boolean}
        source: {type: string, format: uri}
    InstalledModel:
      type: object
      required: [name, size]
      properties:
        name: {type: string}
        size: {type: integer, format: int64, description: Downloaded bytes reported by Ollama.}
    ModelInstallation:
      type: object
      required: [id, connectionId, model, status, message, total, completed, created]
      properties:
        id: {type: string}
        connectionId: {type: string}
        model: {type: string}
        status:
          type: string
          enum: [running, succeeded, failed, cancelled, interrupted]
        message: {type: string}
        total: {type: integer, format: int64, description: "Bytes in the current layer, or 0 when not yet known."}
        completed: {type: integer, format: int64}
        created: {type: string, format: date-time}
    ModelInventory:
      type: object
      required: [catalog, installed, installations]
      properties:
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/ModelPreset'
        installed:
          type: array
          items:
            $ref: '#/components/schemas/InstalledModel'
        installations:
          type: array
          items:
            $ref: '#/components/schemas/ModelInstallation'
        runtimeError: {type: string}
    ProviderCall:
      type: object
      properties:
        attempt_id:
          type: string
        connection_id:
          type: string
        kind:
          type: string
          enum:
          - ollama
          - openai
          - anthropic
          - gemini
        model:
          type: string
        started:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - running
          - succeeded
          - failed
          - cancelled
          - interrupted
        error:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
      additionalProperties: false
      required:
      - attempt_id
      - connection_id
      - kind
      - model
      - started
      - duration_ms
      - status
    InferenceInputs:
      type: object
      properties:
        inputs:
          type: object
          additionalProperties:
            type: string
          description: Contents of selected, approved file inputs keyed by their declared name. The server supplies literal
            inputs and selects the approved template and connection.
      additionalProperties: false
    InferenceResult:
      type: object
      properties:
        text:
          type: string
        truncated:
          type: boolean
      additionalProperties: false
      required:
      - text
      - truncated
    OverviewHour:
      type: object
      properties:
        start:
          type: string
          format: date-time
        runs:
          type: integer
        failures:
          type: integer
      additionalProperties: false
      required:
      - start
      - runs
      - failures
    RecentFailure:
      type: object
      properties:
        id:
          type: string
        jobName:
          type: string
        jobType:
          type: string
          enum:
          - script
          - ai
        machineId:
          type: string
        state:
          type: string
          enum:
          - failed
          - timed_out
          - interrupted
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - jobName
      - jobType
      - machineId
      - state
      - createdAt
    Overview:
      type: object
      properties:
        queued:
          type: integer
        running:
          type: integer
        failed24h:
          type: integer
        unhealthyConnections:
          type: integer
        hourly:
          type: array
          items:
            $ref: '#/components/schemas/OverviewHour'
          minItems: 24
          maxItems: 24
        recentFailures:
          type: array
          items:
            $ref: '#/components/schemas/RecentFailure'
          maxItems: 3
      additionalProperties: false
      required:
      - queued
      - running
      - failed24h
      - unhealthyConnections
      - hourly
      - recentFailures
      description: Current queue counts, enabled connections in error, and count of currently unsuccessful runs whose
        latest attempt ended in the past 24 hours. Hourly series groups runs by creation time. Recent failures are ordered
        by finish time across retained history.
