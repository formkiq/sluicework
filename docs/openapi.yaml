openapi: 3.1.0
info:
  title: Sluicework API
  version: 1.0.0
  description: Single-cluster v1 API for the same-origin console and outbound workers. The cluster is one shared team
    workspace. Browser mutations use application/json and the same origin. The service requires verified HTTPS on the
    LAN and permits HTTP on loopback for local setup. Request bodies are limited to 10 MiB, except worker completion
    uploads, which allow 25 MiB to accommodate JSON escaping of bounded result bytes. All dates with offsets use RFC
    3339. IDs are opaque strings.
servers:
- url: /api/v1
security:
- browserSession: []
paths:
  /openapi.yaml:
    get:
      operationId: getAPIContract
      summary: Download the OpenAPI 3.1 contract
      tags:
      - Contract
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/yaml:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /login:
    post:
      operationId: login
      summary: Start a browser session
      tags:
      - Session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Set-Cookie:
              description: 12-hour HttpOnly SameSite=Strict session cookie scoped to /api/v1. Secure over HTTPS.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /logout:
    post:
      operationId: logout
      summary: End the current session
      tags:
      - Session
      security: []
      responses:
        '204':
          description: Completed with no response body.
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /session:
    get:
      operationId: getSession
      summary: Get the signed-in user
      tags:
      - Session
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /overview:
    get:
      operationId: getOverview
      summary: Read cluster activity and recent failures
      tags:
      - Overview
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /github/repositories:
    get:
      operationId: listGitHubRepositories
      summary: Administrator list of explicitly configured repository contexts
      responses:
        '200':
          description: Primary and approved shared repositories
          content:
            application/json:
              schema:
                type: object
                required: [primaryRepository, repositories]
                properties:
                  primaryRepository: {type: string}
                  repositories: {type: array, items: {type: string}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /github/runner-groups:
    get:
      operationId: listWorkstationRunnerGroups
      summary: Organization-owned groups limited to selected private repositories
      responses:
        '200':
          description: Candidates for shared workstation registration; exact access is validated before a grant
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/GitHubRunnerGroup'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /github/runners:
    parameters:
    - {name: repository, in: query, required: false, schema: {type: string}, description: Explicitly approved repository; defaults to the primary repository}
    get:
      operationId: listGitHubRunners
      summary: Administrator inventory of repository and opted-in organization runners
      responses:
        '200':
          description: Runner metadata, access checks and unique placement targets; no credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubRunnerInventory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Configure a GitHub App first
        '502':
          description: GitHub rejected repository access; organization failures are reported separately in the inventory
  /github/runners/{scope}/{id}/labels:
    parameters:
    - {name: repository, in: query, required: false, schema: {type: string}, description: Explicitly approved repository; defaults to the primary repository}
    - {name: scope, in: path, required: true, schema: {type: string, enum: [repository, organization]}}
    - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    put:
      operationId: updateExternalGitHubRunnerLabels
      summary: Replace only an external runner's custom labels; Sluicework-owned runners are protected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [labels]
              properties:
                labels:
                  type: array
                  maxItems: 32
                  uniqueItems: true
                  items: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'}
                  description: Default platform labels and the sluicework- prefix are reserved
      responses:
        '204': {description: Label update requested in GitHub and audited}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Runner not found in this scope}
        '502': {description: GitHub rejected the management request}
  /github/runners/{scope}/{id}:
    parameters:
    - {name: repository, in: query, required: false, schema: {type: string}, description: Explicitly approved repository; defaults to the primary repository}
    - {name: scope, in: path, required: true, schema: {type: string, enum: [repository, organization]}}
    - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    delete:
      operationId: removeExternalGitHubRunner
      summary: Remove an idle offline external registration after exact-name confirmation; stop its host service first
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmName]
              properties:
                confirmName: {type: string, description: Exact current GitHub runner name}
      responses:
        '204': {description: Registration removed and request audited}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Runner busy, online, renamed, or connection replaced}
        '502': {description: GitHub rejected removal; host processes were not signalled}
  /github/runners/registration:
    parameters:
    - {name: repository, in: query, required: false, schema: {type: string}, description: Explicitly approved repository; defaults to the primary repository}
    post:
      operationId: prepareExternalRunnerRegistration
      summary: Administrator-only guided official runner setup with a short-lived registration token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, os, arch, name, label]
              properties:
                scope: {type: string, enum: [repository, organization]}
                os: {type: string, enum: [linux, osx]}
                arch: {type: string, enum: [arm64, x64]}
                name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'}
                label: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'}
      responses:
        '200':
          description: Non-cacheable setup session; token is not stored in SQLite or audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubRegistrationSetup'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {description: Missing GitHub management permission or official download metadata}
  /github/routing:
    parameters:
    - {name: repository, in: query, required: false, schema: {type: string}, description: Explicitly approved repository; defaults to the primary repository}
    get:
      operationId: getGitHubBuildPlacement
      summary: Read version 1 integration metadata and the published policy or existing defaults
      responses:
        '200':
          description: Policy with edit revision; requires Contents read and Variables write grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubRoutingState'
        '400': {description: Invalid manually edited published configuration}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Integration manifest is not installed}
        '502': {description: Additional GitHub App permissions need approval}
    put:
      operationId: publishGitHubBuildPlacement
      summary: Publish a complete versioned SLUICEWORK_ROUTING variable for future compatible workflow runs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy, revision]
              properties:
                policy:
                  $ref: '#/components/schemas/GitHubRoutingPolicy'
                revision: {type: string, description: Revision from the last successful read}
      responses:
        '200':
          description: One repository variable published; workflow files and already dispatched jobs are unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubRoutingState'
        '400': {description: Invalid, ambiguous, unsupported or unavailable target}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale edit or replaced connection; reload before saving}
        '502': {description: GitHub rejected the management request}
  /harness:
    get:
      operationId: getCodingGateway
      summary: Read coding gateway policy, client metadata and recent request audit
      responses:
        '200': {description: Policy, clients without credentials, and metadata-only call history}
        '403': {$ref: '#/components/responses/Forbidden'}
  /harness/policy:
    put:
      operationId: updateCodingGatewayPolicy
      summary: Enable or pause coding access and set shared local inference admission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, maxConcurrent]
              properties:
                enabled: {type: boolean}
                maxConcurrent: {type: integer, minimum: 1, maximum: 4}
      responses:
        '204': {description: Policy updated and audited; paused coding requests are cancelled}
        '403': {$ref: '#/components/responses/Forbidden'}
  /harness/clients:
    post:
      operationId: createCodingClient
      summary: Issue a one-time model-scoped coding credential for any client workstation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, serverUrl, connectionId, models, contextLength, maxOutputTokens, maxConcurrent, timeoutSeconds, lifetimeDays]
              properties:
                name: {type: string, maxLength: 128}
                serverUrl: {type: string, description: Explicit HTTPS orchestrator origin reachable from the client; no localhost default}
                connectionId: {type: string, description: Enabled Ollama or Herd connection}
                models: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
                contextLength: {type: integer, minimum: 4096, maximum: 32768}
                maxOutputTokens: {type: integer, minimum: 128, maximum: 8192}
                maxConcurrent: {type: integer, minimum: 1, maximum: 4}
                timeoutSeconds: {type: integer, minimum: 15, maximum: 1800, default: 1800}
                lifetimeDays: {type: integer, minimum: 1, maximum: 90}
      responses:
        '200': {description: One-time private client bundle and public CA fingerprint; server stores only the credential hash}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /harness/clients/{id}/timeout:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    put:
      operationId: updateCodingClientTimeout
      summary: Set the timeout for subsequent requests without rotating the client credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeoutSeconds]
              properties:
                timeoutSeconds: {type: integer, minimum: 15, maximum: 1800}
      responses:
        '204': {description: Timeout saved and audited; active requests keep their existing deadline}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /harness/clients/{id}/revoke:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: revokeCodingClient
      summary: Revoke a coding client and cancel its active model requests
      responses:
        '204': {description: Credential revoked and operation audited}
        '403': {$ref: '#/components/responses/Forbidden'}
  /harness/v1/models:
    get:
      operationId: codingModels
      security: [{codingBearer: []}]
      summary: List the coding credential's current permitted models
      responses:
        '200': {description: OpenAI-compatible model inventory scoped to this credential}
        '401': {description: Credential invalid, expired or revoked}
        '503': {description: Coding gateway or inference connection disabled}
  /harness/v1/responses:
    post:
      operationId: codingResponse
      security: [{codingBearer: []}]
      summary: Execute a server-governed stateless Responses request through native local inference
      description: No cookie or worker credential is accepted. The server chooses the configured model endpoint, enforces the current model allowlist and output/context/keep-alive limits, shares admission with scheduled local AI requests, and audits metadata only. Text messages and client-executed function/custom tools are supported. Stateful IDs, cloud routing, hosted tools and resource overrides are rejected. Remote access requires HTTPS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: {type: string}
                input: {description: Text or a complete array of messages, tool calls and client tool outputs}
                stream: {type: boolean}
                max_output_tokens: {type: integer, minimum: 1, description: Clamped to the server-side client limit}
                tools: {type: array, items: {type: object}}
      responses:
        '200':
          description: Completed JSON response or SSE response events; incomplete/broken streams cannot report success
          content:
            application/json: {schema: {type: object}}
            text/event-stream: {schema: {type: string}}
        '400': {description: Unsupported or invalid Responses request}
        '401': {description: Credential invalid, expired or revoked}
        '429': {description: Capacity did not become available within the bounded admission wait}
        '502': {description: Model request failed; provider diagnostics and credentials are withheld}
        '503': {description: Coding gateway paused}
        '504': {description: Coding client request deadline exceeded; reduce input/output or adjust the client timeout}
  /github/spot:
    get:
      operationId: getGitHubSpotFleet
      summary: Read shared Spot settings and authenticated fleet readiness
      tags: [GitHub Actions]
      responses:
        '200':
          description: Settings, edit revision, supported profiles, approved repositories and public allocation status
          content:
            application/json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Configure the primary GitHub connection and version 3 integration first}
        '502': {description: GitHub rejected the management request}
    put:
      operationId: updateGitHubSpotFleet
      summary: Publish audited shared Spot settings for new admissions
      tags: [GitHub Actions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings, revision]
              properties:
                settings:
                  type: object
                  required: [version, backendId, enabled, maxConcurrent, queueMinutes, startupMinutes, runtimeMinutes, repositories]
                  properties:
                    version: {type: integer, enum: [1]}
                    backendId: {type: string}
                    enabled: {type: boolean}
                    maxConcurrent: {type: integer, minimum: 0, maximum: 3}
                    queueMinutes: {type: integer, minimum: 1, maximum: 30}
                    startupMinutes: {type: integer, minimum: 1, maximum: 15}
                    runtimeMinutes: {type: integer, minimum: 15, maximum: 180}
                    repositories:
                      type: object
                      description: Approved repository full names mapped to runner profiles
                      additionalProperties: {type: string, enum: [small, standard]}
                revision: {type: string, description: Revision from the last read}
      responses:
        '200': {description: Published settings and refreshed fleet state}
        '400': {description: Invalid settings, unapproved repository or unavailable fleet}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale revision; refresh before saving}
        '502': {description: GitHub rejected the management request}
  /github/activity:
    get:
      operationId: getGitHubBuildActivity
      summary: Read cached GitHub build activity for enrolled workstation runners
      description: Metadata is synchronized in the background with a separate Actions read token. Failures retain last-known records and an issue message; no runner-control request depends on sync. Up to 100 active/recent records are returned. Logs and artifacts remain on GitHub.
      tags:
      - GitHub Actions
      responses:
        '200':
          description: Cached activity, or configured false when no GitHub App is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubActivity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /machines:
    get:
      operationId: listMachines
      summary: List workers and current capacity
      tags:
      - Machines
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Machine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /machines/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateMachine
      summary: Update labels, capacity, drain state or CI registration
      tags:
      - Machines
      description: Operators may change draining, slots and roleLimits, independently or together. Changing labels or
        the GitHub runner registration requires an administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachinePatch'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /machines/{id}/revoke:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: revokeMachine
      summary: Permanently revoke the worker credential
      tags:
      - Machines
      x-required-role: admin
      responses:
        '204':
          description: Completed with no response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /enrollment-tokens:
    post:
      operationId: issueEnrollmentToken
      summary: Issue a one-use enrollment token
      tags:
      - Machines
      x-required-role: admin
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /jobs:
    get:
      operationId: listJobs
      summary: List current approved job definitions
      tags:
      - Jobs
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createJob
      summary: Approve a new job template
      tags:
      - Jobs
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /jobs/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getJob
      summary: Get the current job revision
      tags:
      - Jobs
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: reviseJob
      summary: Approve a new revision of a job
      tags:
      - Jobs
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /jobs/{id}/runs:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: queueRun
      summary: Queue a run with selected inputs
      tags:
      - Jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputValues'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /runs:
    get:
      operationId: listRuns
      summary: List the 100 most recent matching runs
      tags:
      - Runs
      parameters:
      - name: job
        in: query
        description: Job ID.
        required: false
        schema:
          type: string
      - name: machine
        in: query
        description: ID of a machine assigned to any attempt.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Current run state.
        required: false
        schema:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - timed_out
          - cancelled
          - interrupted
      - name: before
        in: query
        description: Return the next page of older matching runs using the final run ID from the previous page.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
