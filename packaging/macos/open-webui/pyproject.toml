[project]
name = "sluicework-open-webui-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["open-webui==0.13.4"]

[tool.uv]
package = false
# Patched cryptography no longer ships Intel macOS wheels. Keep the optional
# native runtime scoped to binary-only targets; existing WebUI connections work
# on every Sluicework platform.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Deliberate security overrides of upstream slim pins. Keep the OTel family
# together; see docs/open-webui-installer-review.md and audit.py.
override-dependencies = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-instrumentation==0.66b2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-redis==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-aiohttp-client==0.66b2",
    "opentelemetry-instrumentation-system-metrics==0.66b2",
    "authlib==1.9.10",
    "black==26.10.1",
    "cryptography==50.0.2",
    "joserfc==1.8.0",
    "pyjwt==2.15.1",
]
